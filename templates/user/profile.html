{% extends 'base.html' %}
{% block bodyclass %}bg-profile{% endblock %}
{% block title %}My Profile - TrekManager{% endblock %}
{% block content %}
<div class="container">
    <div style="margin-bottom:16px;">
        <a href="{{ url_for('user_dashboard') }}" class="btn btn-grey btn-sm">&larr; Dashboard</a>
    </div>
    <div style="background: linear-gradient(135deg, #1a6b5a, #2d9e88); border-radius: 10px; padding: 28px 24px; color: #fff; margin-bottom: 22px;">
        <h2 style="font-size:1.5em; font-weight:bold;">&#9998; Edit Profile</h2>
        <p style="color:#cce8e3; font-size:0.92em; margin-top:4px;">{{ user.username }} &bull; {{ user.role }}</p>
    </div>
    <div class="card" style="max-width:460px;">
        <form action="{{ url_for('user_profile') }}" method="post">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" value="{{ user.email }}">
            </div>
            <div class="form-group">
                <label for="phone">Phone</label>
                <input type="text" id="phone" name="phone" value="{{ user.phone or '' }}" placeholder="Phone number">
            </div>
            <div class="form-group">
                <label for="password">New Password <span style="color:#999; font-weight:normal;">(leave blank to keep current)</span></label>
                <input type="password" id="password" name="password" placeholder="Enter new password">
            </div>
            <button type="submit" class="btn btn-green">Save Changes</button>
        </form>
    </div>
</div>
{% endblock %}
