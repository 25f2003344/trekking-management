{% extends 'base.html' %}
{% block bodyclass %}bg-register{% endblock %}
{% block title %}Register - TrekManager{% endblock %}
{% block content %}
<div style="background: linear-gradient(135deg, #f5a623 0%, #e74c3c 40%, #1a6b5a 100%); min-height: 90vh; display: flex; align-items: center; justify-content: center; padding: 40px 20px;">
    <div style="width:100%; max-width:420px;">
        <div class="card" style="border-radius:12px; padding:32px;">
            <h2 style="text-align:center; color:#1a6b5a; margin-bottom:22px; font-size:1.5em;">&#9968; Create Account</h2>
            <form action="{{ url_for('register') }}" method="post">
                <div class="form-group">
                    <label for="role">Register as</label>
                    <select name="role" id="role">
                        <option value="user">User (Trekker)</option>
                        <option value="staff">Trek Staff</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" placeholder="Choose a username" required>
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="your@email.com" required>
                </div>
                <div class="form-group">
                    <label for="phone">Phone (optional)</label>
                    <input type="text" id="phone" name="phone" placeholder="Phone number">
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Min 6 characters" required minlength="6">
                </div>
                <button type="submit" class="btn btn-green" style="width:100%; padding:10px; font-size:0.97em; margin-top:6px;">Register</button>
            </form>
            <p style="text-align:center; margin-top:16px; font-size:0.88em; color:#666;">
                Already registered? <a href="{{ url_for('login') }}" style="color:#1a6b5a; font-weight:bold;">Login here</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
