{% extends 'base.html' %}
{% block bodyclass %}bg-index{% endblock %}
{% block title %}Welcome - TrekManager{% endblock %}
{% block content %}
<div style="background: linear-gradient(135deg, #1a3a2e 0%, #1a6b5a 60%, #2d9e88 100%); min-height: 88vh; display: flex; align-items: center; justify-content: center; text-align: center; color: #fff; padding: 40px 20px;">
    <div>
        <div style="font-size:4em; margin-bottom:10px;">&#9968;</div>
        <h1 style="font-size:2.8em; font-weight:bold; margin-bottom:14px;">TrekManager</h1>
        <p style="font-size:1.1em; color:#cce8e3; margin-bottom:30px;">Adventure Management, Simplified.</p>
        <a href="{{ url_for('login') }}" class="btn btn-green" style="padding:11px 30px; font-size:1em; margin-right:10px; background:#fff; color:#1a6b5a;">Login</a>
        <a href="{{ url_for('register') }}" class="btn btn-grey" style="padding:11px 30px; font-size:1em; background:rgba(255,255,255,0.2); color:#fff;">Register</a>
        <div style="margin-top:50px; display:flex; gap:40px; justify-content:center; flex-wrap:wrap;">
            <div><div style="font-size:1.8em; font-weight:bold;">50+</div><div style="color:#9ecfc4; font-size:0.85em;">Trek Routes</div></div>
            <div><div style="font-size:1.8em; font-weight:bold;">1000+</div><div style="color:#9ecfc4; font-size:0.85em;">Happy Trekkers</div></div>
            <div><div style="font-size:1.8em; font-weight:bold;">20+</div><div style="color:#9ecfc4; font-size:0.85em;">Expert Staff</div></div>
        </div>
    </div>
</div>
{% endblock %}
